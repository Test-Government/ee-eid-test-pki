name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3     # amd64 only here — no QEMU/arm64

      # Only run the API conformance suite when the API or its spec changed.
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'management/api/**'

      # Build the default image once (native amd64, no push) and load it into
      # the runner's docker daemon so we can start it. Warms the gha cache that
      # the publish job reuses.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ee-eid-test-pki:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name eidpki \
            -p 8080:8080 -p 8081:8081 -p 8082:8082 \
            ee-eid-test-pki:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/trust/community-roots.pem >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container did not become ready"; docker logs eidpki; exit 1

      # Smoke test needs a copy of the container's /pki/out (its own CA + leaf
      # certs) for OCSP/verify. Runs against the fresh container.
      - name: Smoke test
        run: |
          docker cp eidpki:/pki/out ./pki-out
          bash docker/smoke-test.sh ./pki-out

      - name: API conformance (fast)
        if: steps.changes.outputs.api == 'true'
        run: bash docker/conformance.sh http://localhost:8082 fast

      - name: Container logs
        if: always()
        run: docker logs eidpki || true

  publish:
    needs: test
    if: github.event_name != 'pull_request'   # PRs never publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # lets GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # only needed for the arm64 build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/test-government/ee-eid-test-pki   # MUST be lowercase
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha      # reuses the amd64 layers the test job built
          cache-to: type=gha,mode=max
